name: Tests

# Runs on PRs and on pushes to develop branches. Pushes to main don't trigger it
# directly: deploy.yml calls this workflow first, so main is tested once.
#
# Same stack as the dev container and Hostinger: PHP 8.4 + MariaDB 11.4.
# MariaDB, not SQLite: the old laravel_fulltext migration uses FULLTEXT indexes.

on:
  push:
    branches: ['develop/**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP 8.4 · MariaDB 11.4
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: testing
          MARIADB_USER: luane
          MARIADB_PASSWORD: luane
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Real env vars win over .env (and phpunit.xml only sets DB_DATABASE=testing).
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: luane
      DB_PASSWORD: luane

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip, gd, bcmath, exif, fileinfo
          coverage: none
          tools: composer:v2

      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php84-

      - name: Prepare .env
        run: cp .env.example .env

      # post-autoload-dump runs package:discover and filament:upgrade.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate app key
        run: php artisan key:generate

      # The deploy runs `optimize` (config, route, event and view caches).
      # Duplicate route names or a Blade parse error fail here, before deploying.
      - name: Check production caches build
        run: |
          php artisan optimize
          php artisan optimize:clear

      - name: Run tests
        run: php artisan test
